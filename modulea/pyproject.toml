[project]
name = "regspine-modulea"
version = "0.1.0"
description = "RegSpine Module A — the Obligation Engine. Turns SEBI master circulars into a versioned, citation-anchored graph of machine-actionable obligations."
requires-python = ">=3.11,<3.12"

dependencies = [
  "pdfplumber>=0.11",
  "pydantic>=2.9",
  "python-dateutil>=2.9",
  "rapidfuzz>=3.9",          # keyterm fuzzy match in the groundedness gate
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "anthropic>=0.68",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["regspine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
